<section class="episodes-header">
  <h2>Episodes</h2>
  <span class="episode-count">{{page.total}} episodes</span>
</section>

{{#if page.posts}}
<div class="episode-list">
  {{#each page.posts}}
  <article class="episode-card">
    <div class="episode-number">#{{@index}}</div>
    <div class="episode-content">
      <h3><a href="/episode/{{slug}}">{{title}}</a></h3>
      <p class="episode-meta">
        <time datetime="{{isoDate publishedAt}}">{{formatDate publishedAt}}</time>
      </p>
      {{#if excerpt}}<p class="episode-excerpt">{{truncate excerpt 150}}</p>{{/if}}
    </div>
    <button class="play-btn" data-episode="{{slug}}" title="Play">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </article>
  {{/each}}
</div>

{{#if page.hasMore}}
<div class="pagination">
  <a href="/?page={{page.nextPage}}" class="load-more">Load More Episodes</a>
</div>
{{/if}}
{{else}}
<div class="no-episodes">
  <p>No episodes yet. Check back soon!</p>
</div>
{{/if}}
